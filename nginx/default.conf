# Portfolio nginx configuration.
# Serves the static site and exposes a health-check endpoint
# that will be used later by Kubernetes liveness/readiness probes.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the portfolio site
    location / {
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
